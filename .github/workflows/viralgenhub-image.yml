---
name: "ViralGenHub image"

# Builds the ViralGenHub app image and pushes it to GHCR.
#   ghcr.io/joeyblack1/viralgenhub:<git sha>   every build
#   ghcr.io/joeyblack1/viralgenhub:latest      main branch only
# portfolio-vps is x86, so this builds amd64 only.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['vgh-*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags
        id: meta
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAGS="$IMAGE:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then TAGS="$TAGS,$IMAGE:latest"; fi
          if [ "${{ github.ref_type }}" = "tag" ]; then TAGS="$TAGS,$IMAGE:${{ github.ref_name }}"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: NEXT_PUBLIC_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
