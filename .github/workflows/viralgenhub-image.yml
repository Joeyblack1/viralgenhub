name: "ViralGenHub image"

# Builds the ViralGenHub app image and pushes it to GHCR.
#   ghcr.io/joeyblack1/viralgenhub:<git sha>   every build
#   ghcr.io/joeyblack1/viralgenhub:latest      main branch only
# portfolio-vps is x86, so this builds amd64 only.
#
# Supply-chain checks (GO_LIVE_PLAN A5 / #229) run in a separate `audit` job:
#   - pnpm audit --prod --audit-level=high   (lockfile advisories)
#   - Trivy scan of the image this run pushed (CRITICAL,HIGH, fixed only)
# The audit job is NON-BLOCKING for now (continue-on-error: true, and the build
# job does not depend on it): its findings are visible in the run log but a red
# audit never fails the workflow. After a week of clean runs, make it blocking
# by removing `continue-on-error` from the job.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['vgh-*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags
        id: meta
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAGS="$IMAGE:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then TAGS="$TAGS,$IMAGE:latest"; fi
          if [ "${{ github.ref_type }}" = "tag" ]; then TAGS="$TAGS,$IMAGE:${{ github.ref_name }}"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: NEXT_PUBLIC_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  # Non-blocking until a week of clean runs (see the header comment).
  audit:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm

      # No install needed: pnpm audit reads pnpm-lock.yaml and asks the
      # registry's advisory endpoint.
      - name: pnpm audit (production dependencies, high and above)
        continue-on-error: true   # findings must not stop the Trivy step below
        run: pnpm audit --prod --audit-level=high

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: table
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
